# Tests without hardware: the framework + supervisor tests (mock IOCs, prefixes TEST:PT* / TESTSUP:*), then
# every measurement plan against the simulated IOC host and a full control host (control/lab_sim.yaml).
# Python 3.12 (IOC PCs with Nanotec NanoLib) and 3.13 (dev venv); 3.14 is left out: tiled pins a duckdb
# without 3.14 wheels (see HANDOFF).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install (venv, as on the lab PCs)
        # a venv also puts the console scripts next to python, where start_control_host.py looks for them
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then bin="$RUNNER_TEMP/venv/Scripts"; else bin="$RUNNER_TEMP/venv/bin"; fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/python" -m pip install --upgrade pip
          "$bin/python" -m pip install -r requirements-dev.txt
      - name: YAML files load
        run: |
          python - <<'EOF'
          import pathlib, yaml
          files = [p for d in ("control", "sim", "ioc_host", ".github") for p in pathlib.Path(d).rglob("*.y*ml")]
          for p in files:
              yaml.safe_load(p.read_text(encoding="utf-8"))
          print(f"{len(files)} YAML files OK")
          EOF
      - name: Framework tests
        run: python -m pytest -q tests/test_framework.py
      - name: Supervisor tests
        run: python -m pytest -q tests/test_supervisor.py
      - name: Deploy scripts (dry run)
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File deploy/install_ioc_host.ps1 \
              -HostFile ioc_host/hosts/4dmag.example.yaml -Python python -VenvDir "$RUNNER_TEMP/venv" -OpenFirewall -Start -WhatIf
            powershell -NoProfile -ExecutionPolicy Bypass -File deploy/uninstall_ioc_host.ps1 -WhatIf
          else
            bash -n deploy/systemd/install.sh
            bash deploy/systemd/install.sh ioc-host ioc_host/hosts/4dmag.example.yaml --venv "$RUNNER_TEMP/venv" --open-firewall --dry-run
            bash deploy/systemd/install.sh control-host control/lab_sim.yaml --venv "$RUNNER_TEMP/venv" --dry-run
          fi

  sim:
    name: simulator plans (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      FASTQ_ELOG_PASSWORD: simpw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install (venv, as on the lab PCs)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then bin="$RUNNER_TEMP/venv/Scripts"; else bin="$RUNNER_TEMP/venv/bin"; fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/python" -m pip install --upgrade pip
          "$bin/python" -m pip install -r requirements-dev.txt
      - name: Simulator + control host + tests/run_sim_plans.py
        # one step: background processes started here are all gone when it ends, on every runner OS
        run: |
          mkdir -p sim/logs
          set -m  # job control: background jobs get their own process group and do not ignore SIGINT
          pids=()
          stop_all() {  # newest first; Ctrl-C lets sim_stack / start_control_host stop their children
            for ((i = ${#pids[@]} - 1; i >= 0; i--)); do
              if [ "$RUNNER_OS" = Windows ]; then
                taskkill //F //T //PID "$(cat "/proc/${pids[i]}/winpid")" > /dev/null 2>&1 || true
              else
                kill -INT -- "-${pids[i]}" 2> /dev/null || true
              fi
            done
            sleep 10
          }
          trap stop_all EXIT
          wait_for() {  # <file> <text> <seconds>
            for _ in $(seq "$3"); do grep -q "$2" "$1" 2>/dev/null && return 0; sleep 1; done
            echo "::error::timeout waiting for '$2' in $1"; cat "$1"; return 1
          }
          python sim/mock_elog_server.py --port 8091 --user daq --password simpw > sim/logs/mock_elog.out 2>&1 &
          pids+=($!)
          python sim/sim_stack.py > sim/logs/sim_stack.out 2>&1 &
          pids+=($!)
          wait_for sim/logs/sim_stack.out "simulated IOC host running" 180
          sleep 20  # the IOCs answer a few seconds after their processes start
          # --no-open: run_sim_plans.py drives its own RunEngine; the queue server environment is not needed
          python control/start_control_host.py --lab control/lab_sim.yaml --no-open > sim/logs/control_host.out 2>&1 &
          pids+=($!)
          wait_for sim/logs/control_host.out "control host running" 300
          python tests/run_sim_plans.py 2>&1 | tee sim/logs/run_sim_plans.out
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs-${{ matrix.os }}
          path: |
            sim/logs
            sim/data/tiled/*.log
          if-no-files-found: warn
          retention-days: 14
